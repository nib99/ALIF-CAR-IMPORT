  <style>
    :root{
      --teal:#087b78;
      --deep:#073f43;
      --coral:#f36d4f;
      --cream:#fff9ee;
      --ink:#153437;
      --muted:#526467;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;width:100%;font-family:"DM Sans","Noto Sans Ethiopic","Noto Sans Arabic",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
    h1,h2{font-family:Fraunces,"Noto Sans Ethiopic","Noto Sans Arabic",serif;letter-spacing:-.035em}
    html[lang=am] h1,html[lang=am] h2,html[lang=ar] h1,html[lang=ar] h2{font-family:"Noto Sans Ethiopic","Noto Sans Arabic",sans-serif;letter-spacing:0}
    .section-pad{padding:clamp(48px,6vw,90px) 18px}
    .anchor{scroll-margin-top:80px}
    .field{width:100%;min-height:50px;border:1px solid #a8c5c2;border-radius:12px;background:white;padding:12px 15px;color:var(--ink);font-size:16px}
    .field:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffb343;outline-offset:3px}
    .action{transition:transform .18s,filter .18s}
    .action:hover{transform:translateY(-2px);filter:brightness(.96)}
    .action:active{transform:translateY(0)}
    .hero-video{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;object-position:center center;
      filter:brightness(0.82) contrast(1.05);
      pointer-events:none;
    }
    .hero-shade{
      background:linear-gradient(to right, rgba(7,63,67,0.72) 0%, rgba(7,63,67,0.45) 45%, rgba(7,63,67,0.15) 100%);
    }
    .assistant-panel{box-shadow:0 20px 60px #073f4350}
    .assistant-message{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
    .assistant-message.user{margin-inline-start:auto;background:var(--teal);color:white}
    .assistant-message.bot{background:#e9f8f3;color:var(--ink)}
    [dir=rtl] .hero-copy{text-align:right}
    [dir=rtl] .hero-shade{transform:scaleX(-1)}

    /* Gallery */
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .gallery-item{position:relative;border-radius:16px;overflow:hidden;background:#e8f8f3;aspect-ratio:4/3;box-shadow:0 4px 20px #073f4320}
    .gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
    .gallery-item .remove-btn{position:absolute;top:8px;right:8px;background:#f36d4f;color:white;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
    .gallery-item:hover .remove-btn{opacity:1}
    .upload-zone{border:2px dashed #087b78;border-radius:16px;padding:32px;text-align:center;background:#f0faf7;cursor:pointer;transition:background .2s}
    .upload-zone:hover,.upload-zone.dragover{background:#e0f5ef}

    /* Social icons */
    .social-links{display:flex;flex-wrap:wrap;gap:12px}
    .social-links a{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.15);color:white;transition:transform .18s,background .18s}
    .social-links a:hover{transform:translateY(-3px);background:rgba(255,255,255,0.25)}
    .social-links svg{width:22px;height:22px;fill:currentColor}

    @media(max-width:640px){
      .assistant-widget{inset-inline:12px;bottom:calc(14px + env(safe-area-inset-bottom));align-items:flex-end}
      .assistant-panel{width:100%!important;max-width:none!important}
      .assistant-messages{max-height:min(42vh,320px)}
      .site-nav{width:100%;order:3;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
      .site-nav a{white-space:nowrap;padding:6px 2px}
      .hero-copy{padding-top:88px;padding-bottom:72px}
      .section-pad{padding-inline:16px}
      #home{min-height:min(92vh,620px)}
    }
    @media(display-mode:standalone){
      .site-header{padding-top:env(safe-area-inset-top)}
    }
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .action{transition:none}
      .hero-video{display:none}
    }

  so: {

    request: "Wanaagsan — waxaan kaa caawin karaa diyaarinta codsi xooggan.\n\nFadlan ii sheeg:\n• Magacaaga\n• Lambarka taleefanka\n• Baabuurka aad doorbidayso (shirkad/nooc/sannad haddii la yaqaan)\n• Miisaaniyadda qiyaasta ah\n• Luqadda aad doorbidayso\n\nAma buuxi foomka boggan ku yaal, kooxdayaduna way heli doonaan.",
    contact: "Si toos ah ula xiriir ALIF CAR IMPORT:\n\n📞 +251 97 601 1111\n📞 +251 96 969 6936\n💬 WhatsApp: +251 97 601 1111\n\n📍 Meskel Flower, agagaarka Dreamliner Hotel, hoostiisa, ka soo horjeedka Zemen Bank, Addis Ababa.\n\nWicitaanku waa habka ugu degdega ah ee lagu xaqiijiyo helitaanka hadda.",

    brands: "Waxaan la shaqeynaa calaamado caanka ah oo la soo dejiyo sida Toyota, BYD, Honda iyo kuwo kale. Ii sheeg calaamadda ama nooca aad doorbidayso, waxaan kaa caawin doonaa diyaarinta codsiga.",

  let language = "en", sheetReady = false, deferredInstall = null;
  const $ = id => document.getElementById(id);
  const t = key => (translations[language] && translations[language][key]) || en[key] || "";

  function setLanguage(value) {
    language = translations[value] ? value : "en";
    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    $("language").value = language;
    if ($("preferred-language")) $("preferred-language").value = language;
    document.title = "ALIF CAR IMPORT — " + (language === "am" ? "አዲስ አበባ" : language === "ar" ? "أديس أبابا" : language === "om" ? "Finfinnee" : "Addis Ababa");
    $("form-status").textContent = "";
  }

  $("language").addEventListener("change", e => setLanguage(e.target.value));
  setLanguage("en");

  $("whatsapp-link").href = "https://wa.me/251976011111?text=" + encodeURIComponent("Hello ALIF CAR IMPORT, I would like to ask about a vehicle.");

  // Form handling
  const form = $("inquiry-form"), submit = $("submit-button"), status = $("form-status");
  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (submit.disabled) return;
    const data = new FormData(form);
    if (data.get("website")) return;
    const name = String(data.get("customer_name") || "").trim();
    const phone = String(data.get("phone_number") || "").trim();
    const vehicle = String(data.get("vehicle_of_interest") || "").trim();
    const message = String(data.get("message") || "").trim();
    status.className = "mt-3 min-h-6 text-sm font-semibold text-[#a13422]";
    if (!name || !phone || !vehicle || !message) { status.textContent = t("required"); return; }
    if (!/^\+?[\d\s().-]{7,24}$/.test(phone) || phone.replace(/\D/g, "").length < 7) { status.textContent = t("invalidPhone"); return; }
    if (message.length < 10) { status.textContent = t("invalidMessage"); return; }
    if (!sheetReady) { status.textContent = t("unavailable"); return; }
    submit.disabled = true;
    $("submit-label").classList.add("hidden");
    $("sending-label").classList.remove("hidden");
    status.textContent = "";
    try {
      const result = await window.dataSdk.create({
        customer_name: name.slice(0, 100),
        phone_number: phone,
        preferred_language: String(data.get("preferred_language")),
        vehicle_of_interest: vehicle.slice(0, 120),
        budget: String(data.get("budget") || "").trim().slice(0, 80),
        preferred_contact: String(data.get("preferred_contact")),
        message: message.slice(0, 1500),
        inquiry_type: "vehicle_request",
        submitted_at: new Date().toISOString()
      });
      if (!result.isOk) throw new Error("Save failed");
      form.reset();
      $("preferred-language").value = language;
      status.className = "mt-3 min-h-6 text-sm font-semibold text-[#087b78]";
      status.textContent = t("success");
    } catch (_) {
      status.textContent = t("error");
    } finally {
      submit.disabled = false;
      $("submit-label").classList.remove("hidden");
      $("sending-label").classList.add("hidden");
    }
  });

  // Gallery upload logic
  const galleryGrid = $("gallery-grid");
  const galleryEmpty = $("gallery-empty");
  const uploadInput = $("gallery-upload");
  const uploadZone = $("upload-zone");

  function updateGalleryEmpty() {
    galleryEmpty.style.display = galleryGrid.children.length === 0 ? "block" : "none";
  }

  function addGalleryImage(src) {
    const item = document.createElement("div");
    item.className = "gallery-item";
    item.innerHTML = `
      <img src="${src}" alt="Car photo" loading="lazy">
      <button type="button" class="remove-btn" aria-label="Remove">×</button>
    `;
    item.querySelector(".remove-btn").addEventListener("click", () => {
      item.remove();
      updateGalleryEmpty();
    });
    galleryGrid.appendChild(item);
    updateGalleryEmpty();
  }

  uploadInput.addEventListener("change", e => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      if (!file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = ev => addGalleryImage(ev.target.result);
      reader.readAsDataURL(file);
    });
    uploadInput.value = "";
  });

  // Drag & drop
  ["dragenter","dragover"].forEach(evt => {
    uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.add("dragover"); });
  });
  ["dragleave","drop"].forEach(evt => {
    uploadZone.addEventListener(evt, e => { e.preventDefault(); uploadZone.classList.remove("dragover"); });
  });
  uploadZone.addEventListener("drop", e => {
    const files = Array.from(e.dataTransfer.files || []);
    files.forEach(file => {
      if (!file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = ev => addGalleryImage(ev.target.result);
      reader.readAsDataURL(file);
    });
  });

  updateGalleryEmpty();

  // Assistant logic
  const panel = $("assistant-panel"), toggle = $("assistant-toggle"), messages = $("assistant-messages"), input = $("assistant-input");

  function addMessage(text, who = "bot") {
    const el = document.createElement("div");
    el.className = "assistant-message " + who + " rounded-xl px-3 py-2 text-sm leading-6";
    el.textContent = text;
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
  }

  function getReply(q) {
    const c = assistantCopy[language] || assistantCopy.en;
    q = q.toLowerCase();
    if (/process|how|import|steps|ሂደት|adeemsa|استيراد|habka|how to/.test(q)) return c.process;
    if (/request|want|looking|need|interested|ጠይቅ|gaaf|طلب|codsi|buy|purchase/.test(q)) return c.request;
    if (/contact|phone|call|whatsapp|number|ስልክ|bilb|اتصل|xiriir|reach/.test(q)) return c.contact;
    if (/location|address|where|map|meskel|dreamliner|zemen|አድራሻ|bakka|موقع|goobta/.test(q)) return c.location || c.contact;
    if (/budget|price|cost|how much|በጀት|baajata|ميزانية|qiimo/.test(q)) return c.budget || c.request;
    if (/toyota|byd|honda|brand|make|model|car|vehicle|suv/.test(q)) return c.brands || c.request;
    if (/hello|hi|hey|selam|akkam|مرحبا|salaan/.test(q)) return c.hello;
    return c.fallback;
  }

  toggle.addEventListener("click", () => {
    const opening = panel.classList.contains("hidden");
    panel.classList.toggle("hidden");
    toggle.setAttribute("aria-expanded", String(opening));
    if (opening) {
      if (!messages.children.length) addMessage((assistantCopy[language] || assistantCopy.en).hello);
      input.focus();
    }
  });

  $("assistant-close").addEventListener("click", () => {
    panel.classList.add("hidden");
    toggle.setAttribute("aria-expanded", "false");
    toggle.focus();
  });

  $("assistant-form").addEventListener("submit", e => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) return;
    addMessage(value, "user");
    input.value = "";
    setTimeout(() => addMessage(getReply(value)), 400);
  });

  if (window.lucide) lucide.createIcons();

  (async () => {
    try {
      if (!window.dataSdk) return;
      const result = await window.dataSdk.init({ onDataChanged() {} });
      sheetReady = !!result.isOk;
    } catch (_) {
      sheetReady = false;
    }
  })();

  // PWA
  try {
    const manifest = {
      name: "ALIF CAR IMPORT",
      short_name: "ALIF",
      description: "Vehicle inquiries & import assistance in Addis Ababa",
      start_url: location.pathname,
      scope: location.pathname,
      display: "standalone",
      orientation: "portrait-primary",
      background_color: "#fff9ee",
      theme_color: "#087b78",
      icons: [
        { src: "https://images.pexels.com/photos/3802510/pexels-photo-3802510.jpeg?auto=compress&cs=tinysrgb&w=192", sizes: "192x192", type: "image/jpeg", purpose: "any" },
        { src: "https://images.pexels.com/photos/3802510/pexels-photo-3802510.jpeg?auto=compress&cs=tinysrgb&w=512", sizes: "512x512", type: "image/jpeg", purpose: "any maskable" }
      ]
    };
    $("app-manifest").href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" }));
  } catch (_) {}

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstall = e;
    $("install-button").classList.remove("hidden");
  });

  $("install-button").addEventListener("click", async () => {
    if (!deferredInstall) return;
    const event = deferredInstall;
    deferredInstall = null;
    $("install-button").classList.add("hidden");
    await event.prompt();
  });

  window.addEventListener("appinstalled", () => {
    $("install-button").classList.add("hidden");
    deferredInstall = null;
  });
  </script>
</body>
</html>
