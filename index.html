    };
    let language="en",sheetReady=false;
    const status=document.getElementById("form-status");
    function t(key){return translations[language][key]}
    function setLanguage(value){
      language=translations[value]?value:"en";
      document.documentElement.lang=language;
      document.documentElement.dir=language==="ar"?"rtl":"ltr";
      document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});
      document.getElementById("language").value=language;
      document.getElementById("preferred-language").value=language;
      document.title="ALIF CAR IMPORT — "+(language==="am"?"አዲስ አበባ":language==="ar"?"أديس أبابا":"Addis Ababa");
      status.textContent="";
    }
    document.getElementById("language").addEventListener("change",e=>setLanguage(e.target.value));
    setLanguage("en");
    const inventory=[];
    function updateInventory(){
      const query=document.getElementById("vehicle-search").value.trim().toLowerCase();
      const make=document.getElementById("make-filter").value, fuel=document.getElementById("fuel-filter").value,availability=document.getElementById("availability-filter").value;
      const matches=inventory.filter(v=>(!query||(v.make+" "+v.model).toLowerCase().includes(query))&&(!make||v.make===make)&&(!fuel||v.fuel===fuel)&&(!availability||v.availability===availability));
      // No unverified company records are available to render.
      document.querySelector("#inventory [role=status]").hidden=matches.length>0;
    }
    ["vehicle-search","make-filter","fuel-filter","availability-filter"].forEach(id=>document.getElementById(id).addEventListener("input",updateInventory));
    document.getElementById("whatsapp-link").href="https://wa.me/251976011111?text="+encodeURIComponent("Hello ALIF CAR IMPORT, I would like to ask about a vehicle.");
    const form=document.getElementById("inquiry-form"),button=document.getElementById("submit-button");
    form.addEventListener("submit",async e=>{
      e.preventDefault();
      if(button.disabled)return;
      const data=new FormData(form);
      if(data.get("website"))return;
      const name=String(data.get("customer_name")||"").trim(),phone=String(data.get("phone_number")||"").trim(),vehicle=String(data.get("vehicle_of_interest")||"").trim(),message=String(data.get("message")||"").trim();
      status.className="mt-3 min-h-6 text-sm text-[#a13e30]";
      if(!name||!phone||!vehicle||!message){status.textContent=t("required");return}
      if(!/^\+?[\d\s().-]{7,24}$/.test(phone)||phone.replace(/\D/g,"").length<7){status.textContent=t("invalidPhone");return}
      if(message.length<10){status.textContent=t("invalidMessage");return}
      if(!sheetReady){status.textContent=t("unavailable");return}
      button.disabled=true;button.textContent=t("sending");status.textContent="";
      try{
        const result=await window.dataSdk.create({customer_name:name.slice(0,100),phone_number:phone,preferred_language:String(data.get("preferred_language")),vehicle_of_interest:vehicle.slice(0,120),budget:String(data.get("budget")||"").trim().slice(0,80),preferred_contact:String(data.get("preferred_contact")),message:message.slice(0,1500),inquiry_type:"vehicle_request",submitted_at:new Date().toISOString()});
        if(!result.isOk)throw new Error("Inquiry write failed");
        form.reset();document.getElementById("preferred-language").value=language;
        status.className="mt-3 min-h-6 text-sm text-[#277044]";
        status.textContent=t("success");
      }catch(_){status.textContent=t("error")}
      finally{button.disabled=false;button.textContent=t("submit")}
    });
    (async()=>{
      try{
        if(!window.dataSdk)return;
        const result=await window.dataSdk.init({onDataChanged(){}});
        sheetReady=!!result.isOk;
      }catch(_){sheetReady=false}
    })();
  </script>
